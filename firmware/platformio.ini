; WorkBoy keyboard firmware — bare AVR (no Arduino framework)
; ATmega328P @ internal 8 MHz RC. SPI-slave link + 8x7 matrix scan.
;
;   pio run                 build
;   pio run -t fuses        set fuses (internal 8 MHz, BOD 2.7 V)
;   pio run -t upload       flash via the configured programmer
;
; Default programmer is USBasp on the 2x3 ISP header (J2). For Arduino-as-ISP,
; switch upload_protocol to stk500v1 and set upload_port/upload_speed (see below).

[platformio]
src_dir = .

[env:workboy]
platform = atmelavr
board = ATmega328P

; --- clock / fuses (PB6/PB7 become GPIO only with the internal RC oscillator) ---
board_build.f_cpu          = 8000000UL
board_hardware.oscillator  = internal
board_hardware.bod         = 2.7v

; --- programmer: USBasp on the ISP header ---
upload_protocol = usbasp

; --- alternative: Arduino-as-ISP (uncomment, set the COM port) ---
; upload_protocol = stk500v1
; upload_port     = COM5
; upload_speed    = 19200
; upload_flags    = -P$UPLOAD_PORT -b$UPLOAD_SPEED

build_flags = -Wall -Wextra -Os
